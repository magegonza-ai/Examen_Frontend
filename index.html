<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="container mt-4">
            <h1 class="text-center mb-4">Examen de Frontend</h1>

            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="calificaciones-tab" data-bs-toggle="tab" data-bs-target="#calificaciones" type="button" role="tab" aria-controls="calificaciones" aria-selected="true">
                        Cálculo de calificaciones
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="registro-tab" data-bs-toggle="tab" data-bs-target="#registro" type="button" role="tab" aria-controls="registro" aria-selected="false">
                        Formulario de registro
                    </button>
                </li>
            </ul>

            <div class="tab-content p-4 border border-top-0 rounded-bottom shadow-sm bg-white">
                <div class="tab-pane fade show active" id="calificaciones" role="tabpanel" aria-labelledby="calificaciones-tab">
                    <h3 class="mb-3">Cálculo de calificaciones</h3>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Nota 1 (10 - 70)</label>
                            <input type="number" class="form-control" v-model.number="nota1" @input="validarNota1" min="10" max="70" placeholder="Ingrese nota 1">
                            <small v-if="nota1Error" class="text-danger">{{ nota1Error }}</small>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Nota 2 (10 - 70)</label>
                            <input type="number" class="form-control" v-model.number="nota2" @input="validarNota2" min="10" max="70" placeholder="Ingrese nota 2">
                            <small v-if="nota2Error" class="text-danger">{{ nota2Error }}</small>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Nota 3 (10 - 70)</label>
                            <input type="number" class="form-control" v-model.number="nota3" @input="validarNota3" min="10" max="70" placeholder="Ingrese nota 3">
                            <small v-if="nota3Error" class="text-danger">{{ nota3Error }}</small>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Asistencia (0 - 100)</label>
                            <input type="number" class="form-control" v-model.number="asistencia" @input="validarAsistencia" min="0" max="100" placeholder="Ingrese asistencia">
                            <small v-if="asistenciaError" class="text-danger">{{ asistenciaError }}</small>
                        </div>
                    </div>

                    <button class="btn btn-primary" @click="calcular">Calcular</button>

                    <div v-if="resultadoVisible" class="mt-4 p-3 rounded border" :class="aprobado ? 'bg-success text-white' : 'bg-danger text-white'">
                        <p class="mb-1 fs-5"><strong>Promedio ponderado: {{ promedio }}</strong></p>
                        <p class="mb-0 fs-5"><strong>{{ mensajeResultado }}</strong></p>
                    </div>
                </div>
                <div class="tab-pane fade" id="registro" role="tabpanel" aria-labelledby="registro-tab">
                    <h3 class="mb-3">Formulario de registro</h3>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre</label>
                            <input type="text" class="form-control" placeholder="Ingrese su nombre">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Correo</label>
                            <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" placeholder="Ingrese contraseña">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Repetir Contraseña</label>
                            <input type="password" class="form-control" placeholder="Repita la contraseña">
                        </div>
                    </div>

                    <button class="btn btn-primary">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
