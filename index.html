<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div class="container mt-4">
            <h1 class="text-center mb-4">Examen de Frontend</h1>

            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="calificaciones-tab" data-bs-toggle="tab" data-bs-target="#calificaciones" type="button" role="tab" aria-controls="calificaciones" aria-selected="true">
                        Cálculo de calificaciones
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="registro-tab" data-bs-toggle="tab" data-bs-target="#registro" type="button" role="tab" aria-controls="registro" aria-selected="false">
                        Formulario de registro
                    </button>
                </li>
            </ul>

            <div class="tab-content p-4 border border-top-0 rounded-bottom shadow-sm bg-white">
                <div class="tab-pane fade show active" id="calificaciones" role="tabpanel" aria-labelledby="calificaciones-tab">
                    <h3 class="mb-3">Cálculo de calificaciones</h3>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Nota 1 (10 - 70)</label>
                            <input type="number" class="form-control" min="10" max="70" placeholder="Ingrese nota 1">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Nota 2 (10 - 70)</label>
                            <input type="number" class="form-control" min="10" max="70" placeholder="Ingrese nota 2">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Nota 3 (10 - 70)</label>
                            <input type="number" class="form-control" min="10" max="70" placeholder="Ingrese nota 3">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Asistencia (0 - 100)</label>
                            <input type="number" class="form-control" min="0" max="100" placeholder="Ingrese asistencia">
                        </div>
                    </div>

                    <button class="btn btn-primary">Calcular</button>
                </div>
                <div class="tab-pane fade" id="registro" role="tabpanel" aria-labelledby="registro-tab">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
